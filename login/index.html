/* ספר ארבעת המותגים (references/design/brands/BRANDS.md, 03/11/2026), ובמקום שהוא שותק הספר של נוריקה (projects/ai-os-product/brand, 02/11/2026). הדגש קורל #FF6652, כרטיס 32, שדה 20: חמישה צבעים וסקאלות מתוכם, טקסט שחור על תכלת ועל כתום, תכלת עמוק לטקסט על בהיר.
   בלי גרדיאנטים, בלי מסגרות ובלי קווים מפרידים: הפרדה בגוון רקע ובצל רך. כתום מלא רק לדגש אחד, וכתום רך לאזהרה. */
:root {
  --tq: #1FB0CC; --tq-50: #EDF9FB; --tq-100: #D7F1F6; --tq-200: #AAE1EC; --tq-300: #74CEDF; --tq-700: #136D7E; --tq-800: #0E4D5A; --tq-deep: #0A6F86;
  --or: #FF6652; --or-300: #FFA195; --or-600: #C33A28; --or-50: #FFF3F1; --or-soft: #FFE8E5; --or-ink: #941B0B;
  --ink: #0D1117; --ink-2: #171E28; --ink-3: #222B38; --ink-mut: #A9B3C0; --off: #C6CDD6; --off-dark: #3A4452;
  --bg: #F2F4F8; --fg: #0D1117; --muted: #5B6572; --border: #E9EDF2; --tint: #E9EDF2; --card: #fff; --hover: #F6F8FA; --row: #F2F4F8;
  --brand: var(--tq); --brand-deep: var(--tq-deep); --brand-soft: #E0F3F9; --brand-mid: var(--tq-200); --brand-ink: var(--tq-deep); --on-brand: var(--ink); --wait: var(--or-600);
  --panel: var(--ink); --side: var(--ink); --side-acc: var(--tq); --side-knob: var(--ink); --side-ink: var(--ink); --dot: var(--tq);
  --blue: var(--ink); --blue-soft: var(--tint); --green: var(--tq-deep); --green-soft: #E0F3F9; --red: #AC3424; --red-soft: var(--or-soft);
  --grad: var(--tq);
  --sh: 0 1px 2px rgba(13, 17, 23, .04), 0 6px 20px rgba(13, 17, 23, .06);
  --sh-up: 0 14px 40px rgba(13, 17, 23, .12);
  --ring: 0 0 0 4px rgba(31, 176, 204, .35);
  --r-s: 8px; --r: 14px; --r-lg: 32px;
  --f: 'Assistant', 'Arial Hebrew', Arial, sans-serif; --num: 'Poppins', 'Assistant', Arial, sans-serif; --mono: ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, .61, .36, 1); --bar: 36px; --top: 64px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { height: 100%; }
body { min-height: 100%; } /* לא height: הסרגל הדביק בראש נעלם בגלילה כשהגוף נעצר בגובה החלון */
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
h1 { font-size: clamp(1.75rem, 2.8vw, 2.25rem); font-weight: 800; line-height: 1.1; }
b, strong { font-weight: 800; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: start; }
input, textarea { font: inherit; color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid rgba(31, 176, 204, .55); outline-offset: 2px; border-radius: 8px; }
svg.fi-i { width: 20px; height: 20px; flex: none; fill: currentColor; }
.num { font-variant-numeric: tabular-nums; }
.code { font-family: var(--mono); direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--muted); }

/* סרגל אב הטיפוס, מחוץ למוצר */
.proto { position: sticky; top: 0; z-index: 60; height: var(--bar); display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--fg); color: #fff; font-size: .8rem; }
.proto b { white-space: nowrap; color: var(--brand); }
.proto-note { color: #94A3B8; white-space: nowrap; }
.chips { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.chips::-webkit-scrollbar { display: none; }
.chip { padding: 2px 10px; border-radius: 6px; white-space: nowrap; color: #CBD5E1; }
.chip:hover { background: var(--ink-3); color: #fff; }
.chip[aria-current="true"] { background: var(--off-dark); color: #fff; font-weight: 800; }
.proto-more { position: relative; flex: none; }
.proto-btn { background: var(--ink-3); border-radius: 6px; padding: 2px 10px; white-space: nowrap; color: #E2E8F0; }
.proto-btn:hover { background: var(--off-dark); }
.proto :focus-visible { outline-color: var(--brand); }
.pop { position: absolute; top: calc(100% + 6px); inset-inline-end: 0; width: 280px; background: #fff; color: var(--fg); border-radius: var(--r); box-shadow: var(--sh-up); padding: 14px; display: grid; gap: 12px; z-index: 70; font-size: .84rem; }
.pop .lbl { display: block; font-weight: 800; margin-bottom: 4px; }
.pop :focus-visible { outline-color: var(--brand-deep); }
.mode { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; gap: 2px; }
.mode button { flex: 1; text-align: center; border-radius: 6px; padding: 3px 6px; }
.mode button[aria-pressed="true"] { background: #fff; box-shadow: var(--sh); font-weight: 800; }

/* מעטפת */
.shell { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: calc(100% - var(--bar)); }
.sidenav { position: sticky; top: var(--bar); height: calc(100vh - var(--bar)); background: var(--side); color: #fff; display: flex; flex-direction: column; }
.brand { height: var(--top); display: flex; align-items: center; padding-inline: 20px; flex: none; }
.brand .logo { color: #fff; }
.brand .lg-pill, .white-logo .lg-pill { fill: var(--side-acc); }
.brand .lg-knob, .white-logo .lg-knob { fill: var(--side-knob); }
.logo { display: inline-flex; align-items: center; direction: ltr; color: var(--fg); }
.lg { display: block; height: 22px; width: auto; }
.lg-pill { fill: var(--dot); }
.lg-knob { fill: #fff; }

.navs { flex: 1; overflow-y: auto; padding: 16px 10px; display: grid; gap: 18px; align-content: start; }
.navs .all { display: grid; gap: 18px; }
.navs small { display: block; padding: 0 12px 6px; color: var(--ink-mut); font-size: .76rem; font-weight: 800; }
.navs ul { display: grid; gap: 2px; }
.nv { --ic2: var(--ink); position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: var(--r); font-weight: 800; font-size: .95rem; color: hsl(0 0% 100% / .82); transition: background .15s, color .15s; }
.nv svg.i, .nv svg.fi-i { width: 20px; height: 20px; color: var(--ink-mut); transition: color .15s; }
.nv:hover { --ic2: var(--ink-2); background: var(--ink-2); color: #fff; }
.nv[aria-current="page"] { --ic2: var(--ink-3); background: var(--ink-3); color: #fff; }
.nv[aria-current="page"] svg.i, .nv[aria-current="page"] svg.fi-i { color: var(--side-acc); }
.nv-count { margin-inline-start: auto; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 999px; background: var(--side-acc); color: var(--side-ink); font-family: var(--num); font-size: .72rem; font-weight: 800; display: inline-grid; place-items: center; }
.nav-foot { padding: 10px; display: grid; gap: 2px; }
.topbar { position: sticky; top: var(--bar); z-index: 40; height: var(--top); background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-inline: clamp(16px, 2.4vw, 32px); }
.acct { display: flex; align-items: center; gap: 10px; font-weight: 800; min-width: 0; }
.top-logo { display: none; }
.pcchip { display: inline-flex; align-items: center; gap: 7px; font-size: .84rem; font-weight: 400; color: var(--muted); padding-inline-start: 8px; white-space: nowrap; }
.top-act { display: flex; align-items: center; gap: 8px; }
.top-act .btn { height: 44px; }
.hb-lab { display: none; }
.iconbtn { --ic2: var(--bg); position: relative; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; background: var(--bg); color: var(--fg); transition: background .15s; }
.iconbtn:hover { --ic2: var(--tint); background: var(--tint); }
.iconbtn .dotn { position: absolute; top: -6px; inset-inline-end: -6px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: var(--or); color: var(--ink); font-family: var(--num); font-size: .66rem; font-weight: 800; display: grid; place-items: center; }
.iconbtn .dotn.tq { background: var(--tq); }
main { padding: clamp(18px, 2.4vw, 32px); padding-bottom: 64px; min-width: 0; }
.page { max-width: 1240px; margin-inline: auto; display: grid; gap: 24px; }
.page.enter > * { animation: rise .32s var(--ease) both; }
.page.enter > *:nth-child(2) { animation-delay: .04s; }
.page.enter > *:nth-child(3) { animation-delay: .08s; }
.page.enter > *:nth-child(4) { animation-delay: .12s; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.head { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end; justify-content: space-between; }
.head small { display: block; color: var(--muted); font-size: .88rem; margin-bottom: 3px; }
.lead { color: var(--muted); max-width: 66ch; margin-top: 5px; }
.back { font-weight: 800; font-size: .9rem; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; width: fit-content; }
.back:hover { color: var(--fg); }
.back svg.i { width: 16px; height: 16px; }

/* כפתורים */
/* הכפתורים מהספר: עגולים לגמרי, ראשי בתכלת עם טקסט שחור, משני בתכלת רך, ושום כפתור אדום */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 999px; padding: 0 22px; font-weight: 800; font-size: .95rem; white-space: nowrap; transition: background .2s, color .2s, box-shadow .2s; }
.btn:focus-visible { outline: 0; box-shadow: var(--ring); }
.btn svg.i { width: 16px; height: 16px; }
.btn.pri { background: var(--tq); color: var(--ink); }
.btn.pri:hover { background: #4CC4DB; }
.btn.pri:active { background: #1593AD; }
.btn.line { background: var(--brand-soft); color: var(--brand-deep); }
.btn.line:hover { background: var(--tq-100); }
.btn.ghost-red { color: var(--brand-deep); }
.btn.ghost-red:hover { background: var(--tq-50); }
.btn.redline { background: var(--tint); color: var(--fg); }
.btn.redline:hover { background: var(--off); }
.btn.redfill { background: var(--ink); color: #fff; }
.btn.sim { color: var(--muted); background: var(--tint); font-weight: 800; }
.btn.sim:hover { background: var(--off); }
.btn.sm { min-height: 36px; padding: 0 16px; font-size: .88rem; }
.btn.full { width: 100%; min-height: 48px; }
.link { color: var(--muted); font-size: .87rem; font-weight: 800; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.link:hover { color: var(--fg); }
.link svg.i { width: 15px; height: 15px; }
.tlink { color: var(--brand-ink); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }

/* כרטיסים */
.card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--sh); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 20px 12px; }
.card-h h2 { font-size: 1.15rem; font-weight: 800; line-height: 1.25; }
.card-h small { display: block; color: var(--muted); font-size: .84rem; }
.card-b { padding: 16px 20px; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 800; white-space: nowrap; }
.pill.accent { background: var(--brand-soft); color: var(--brand-ink); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.red { background: var(--or-soft); color: var(--or-ink); }
.pill.blue { background: var(--blue-soft); color: var(--blue); }
.pill.gray { background: var(--tint); color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--tq); }
.dot.live { animation: ping 2.2s ease-out infinite; }
.dot.bad { background: var(--or-600); }
.dot.off { background: var(--off); }
.dot.wait { background: var(--wait); animation: pingg 1.8s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(31, 176, 204, .5); } 100% { box-shadow: 0 0 0 8px rgba(31, 176, 204, 0); } }
@keyframes pingg { 0% { box-shadow: 0 0 0 0 rgba(255, 102, 82, .55); } 100% { box-shadow: 0 0 0 9px rgba(255, 102, 82, 0); } }

/* דמות */
.face { display: inline-block; flex: none; border-radius: 50%; object-fit: cover; object-position: top center; background: var(--brand-soft); width: 40px; height: 40px; }
.face.s { width: 30px; height: 30px; }
.face.l { width: 46px; height: 46px; }
.off-face { filter: grayscale(1); opacity: .65; }
.stack { display: inline-flex; }
.stack .face { width: 30px; height: 30px; box-shadow: 0 0 0 2px #fff; }
.stack .face + .face { margin-inline-start: -9px; }

/* התראה */
.alert { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; border-radius: var(--r); padding: 11px 16px; }
.alert svg.i { flex: none; }
.alert b { font-weight: 800; }
.alert span { flex: 1 1 300px; }
.alert.red { background: var(--or-soft); color: var(--or-ink); }
.alert.red svg.i { color: var(--or-600); }
.alert.solid { background: var(--ink); color: #fff; } /* לא קורל: הדגש רק בפרט קטן, וכאן הוא כבר על הפעמון */

/* כרטיסי נתון */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.tile { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; width: 100%; padding: 18px 20px; background: #fff; border-radius: var(--r-lg); box-shadow: var(--sh); transition: transform .22s var(--ease), box-shadow .22s var(--ease); }
button.tile:hover { transform: translateY(-2px); box-shadow: var(--sh-up); }
.tile > * { position: relative; }
.tile .ic { --ic2: var(--t-bg); width: 46px; height: 46px; border-radius: var(--r); background: var(--t-bg); color: var(--t-fg); display: grid; place-items: center; }
.tile .ic svg.i, .tile .ic svg.fi-i { width: 26px; height: 26px; }
.tile .lab { color: var(--muted); font-size: .88rem; }
.tile .val { font-family: var(--num); font-size: 1.85rem; font-weight: 800; line-height: 1.1; }
.tile .val small { font-size: .95rem; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.tile .sub { color: var(--muted); font-size: .82rem; margin-top: 3px; }
.t-accent { --t-bg: var(--brand-soft); --t-fg: var(--tq); }
.t-green { --t-bg: var(--brand-soft); --t-fg: var(--tq); }
.t-red { --t-bg: var(--or-soft); --t-fg: var(--or-600); }
.t-blue { --t-bg: var(--tint); --t-fg: var(--ink); }

/* לוח הצוות */
.board-th, .bw { display: grid; grid-template-columns: minmax(210px, 1.5fr) minmax(170px, 1fr) minmax(190px, auto) 56px 38px; gap: 16px; align-items: center; padding-inline: 20px; }
.board-th { padding-block: 4px 6px; margin-inline: 10px; font-size: .8rem; font-weight: 800; color: var(--muted); }
.bw { padding-block: 12px; margin: 0 10px 6px; border-radius: var(--r); background: var(--row); transition: background .15s; }
.bw:hover { background: var(--tq-50); }
.bw.late { background: var(--or-50); }
.bw-who { display: flex; align-items: center; gap: 12px; min-width: 0; width: 100%; }
.bw-who b { display: block; font-weight: 800; font-size: 1rem; line-height: 1.25; transition: color .15s; }
.bw-who small { display: block; color: var(--muted); font-size: .84rem; line-height: 1.3; }
.bw-who:hover b { color: var(--brand-deep); }
.hb { display: flex; align-items: center; gap: 9px; font-size: .9rem; font-weight: 800; }
.hb.bad { color: var(--red); }
.hb.off { color: var(--muted); font-weight: 400; }
.sync { display: block; font-size: .78rem; font-weight: 400; color: var(--muted); }
.lvcell { display: grid; gap: 3px; justify-items: start; }
.lvcell small { font-size: .78rem; color: var(--muted); }
.lvs { display: inline-flex; background: var(--tint); border-radius: 999px; padding: 3px; gap: 2px; }
.lvs button { width: 34px; height: 30px; border-radius: 999px; text-align: center; font-family: var(--num); font-weight: 800; font-size: .86rem; color: var(--muted); transition: background .15s, color .15s; }
.lvs button:hover { color: var(--fg); background: #fff; }
.lvs button[aria-pressed="true"] { background: var(--tq); color: var(--ink); }
.bw.off .lvs { opacity: .55; }
/* המתג מהספר: דלוק בתכלת עם ידית שחורה, כבוי באפור עם ידית לבנה. בעברית הידית של הדלוק בצד שמאל, כמו בלוגו */
.sw { position: relative; width: 42px; height: 24px; border-radius: 999px; background: var(--off); flex: none; transition: background .25s; }
.sw::before { content: ""; position: absolute; inset: -10px; }
.sw::after { content: ""; position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: right .45s ease-in-out, background .25s; }
.sw[aria-checked="true"] { background: var(--tq); }
.sw[aria-checked="true"]::after { right: 21px; background: var(--ink); box-shadow: none; }
.sw:disabled { opacity: .45; cursor: not-allowed; }
.rowconfirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 20px; margin: 0 10px 6px; border-radius: var(--r); background: var(--brand-soft); }
.rowconfirm span { flex: 1 1 320px; }
.rowconfirm b { font-weight: 800; }
.board-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 20px; }
.guard { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: .88rem; }
.guard svg.i { color: var(--green); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 11px 16px; margin: 0 10px 6px; width: calc(100% - 20px); border-radius: var(--r); background: var(--row); }
.lrow:last-child { margin-bottom: 10px; }
button.lrow:hover { background: var(--tq-50); }
.lrow .tx { flex: 1; min-width: 0; }
.lrow b { display: block; font-weight: 800; line-height: 1.3; }
.lrow small { display: block; color: var(--muted); font-size: .82rem; }
.lrow time { color: var(--muted); font-size: .84rem; white-space: nowrap; }
.empty { display: grid; justify-items: center; text-align: center; gap: 6px; padding: 34px 20px; }
.empty .eic { --ic2: var(--tq-50); width: 64px; height: 64px; border-radius: 50%; background: var(--tq-50); color: var(--tq); display: grid; place-items: center; margin-bottom: 6px; }
.empty .eic svg { width: 30px; height: 30px; }
.empty b { font-weight: 800; font-size: 1.05rem; }
.empty p { color: var(--muted); max-width: 48ch; }

/* כניסה */
.login { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: calc(100vh - var(--bar)); }
.login-side { position: relative; overflow: hidden; background: var(--panel); color: #fff; display: flex; flex-direction: column; padding: clamp(28px, 4vw, 56px); gap: 18px; }
.login-side::before { content: ""; position: absolute; width: 620px; height: 620px; border-radius: 50%; top: -220px; inset-inline-end: -180px; background: var(--ink-2); }
.white-logo { position: relative; display: inline-flex; align-items: center; gap: 5px; direction: ltr; align-self: flex-start; }
.white-logo { color: #fff; }
.white-logo .lg { height: clamp(34px, 3vw, 46px); }
.lg-btn { display: block; padding: 0; background: none; border: 0; color: inherit; cursor: pointer; }
.lg-knob { transition: transform .5s ease-in-out; }
.lg-pill { transition: fill .3s; }
.lg-btn.idle .lg-knob { animation: lg-knob 6s var(--ease) infinite; }
.lg-btn[aria-pressed="false"] .lg-knob, .logo:hover .lg-knob { transform: translateX(46px); }
.lg-btn[aria-pressed="false"] .lg-pill { fill: var(--off-dark); }
@keyframes lg-knob { 0%, 58% { transform: none; } 66%, 82% { transform: translateX(46px); } 90%, 100% { transform: none; } }
.white-logo i { width: 0; margin-inline: 8px; }
.white-logo .t { font-size: .92rem; font-weight: 400; color: var(--ink-mut); }
.login-side h2 { position: relative; font-size: clamp(2.1rem, 3.5vw, 4.4rem); font-weight: 800; line-height: 1.06; margin-top: clamp(10px, 3vh, 36px); color: #fff; }
.login-side p { position: relative; font-size: clamp(1.2rem, 1.9vw, 1.9rem); font-weight: 400; line-height: 1.25; color: var(--ink-mut); }
.lu-feed { position: relative; flex: 1 1 0; min-height: 130px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 9px; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 30px); mask-image: linear-gradient(180deg, transparent 0, #000 30px); }
.lu-card { flex: none; display: flex; align-items: center; gap: 10px; max-width: min(500px, 100%); padding: 8px 14px 8px 12px; border-radius: 14px; background: var(--ink-2); border: 0; color: #fff; line-height: 1.3; transition: opacity .35s, transform .4s var(--ease); }
.lu-card { border-start-start-radius: 4px; }
.lu-card.old { opacity: .74; }
.lu-card.fresh { animation: lu-fresh 1.1s var(--ease); }
@keyframes lu-fresh { from { background: var(--tq-800); } }
.lu-fly { position: absolute; top: 0; left: 0; z-index: 6; opacity: 0; pointer-events: none; transform-origin: var(--tail) 100%; transition: transform .52s cubic-bezier(.3, 1.28, .6, 1), opacity .12s; will-change: transform; }
.lu-fly.on { opacity: 1; }
.lu-fly.open { transition: transform .3s var(--ease), width .3s var(--ease), height .3s var(--ease); }
.lu-fly.land { transition: transform .58s cubic-bezier(.45, .05, .2, 1), width .58s cubic-bezier(.45, .05, .2, 1), height .58s cubic-bezier(.45, .05, .2, 1); }
.lu-bub { position: relative; overflow: hidden; width: 100%; height: 100%; max-width: none; background: #fff; border-radius: 16px; color: var(--fg); box-shadow: 0 10px 26px rgba(0, 0, 0, .45); transition: background .5s, border-color .5s, border-radius .5s, color .5s, box-shadow .5s; }
.lu-fly.land .lu-bub { background: var(--ink-2); border-radius: 14px; border-start-start-radius: 4px; color: #fff; box-shadow: none; }
.lu-card.lu-bub img { width: 0; margin-inline-end: -10px; opacity: 0; transition: width .58s cubic-bezier(.45, .05, .2, 1), margin .58s cubic-bezier(.45, .05, .2, 1), opacity .35s; }
.lu-fly.land .lu-bub img { width: 34px; margin-inline-end: 0; opacity: 1; }
.lu-fly .lu-tx { flex: none; width: var(--tw); opacity: 0; transition: opacity .22s .08s; }
.lu-fly.open .lu-tx { opacity: 1; }
.lu-card.lu-bub .lu-ap { color: var(--brand-deep); transition: color .5s; }
.lu-fly.land .lu-bub .lu-ap { color: var(--tq-300); }
.lu-dots { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 4px; transition: opacity .14s; }
.lu-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--brand-deep); animation: tdot 1s infinite; }
.lu-dots i:nth-child(2) { animation-delay: .15s; }
.lu-dots i:nth-child(3) { animation-delay: .3s; }
.lu-fly.open .lu-dots { opacity: 0; }
.lu-tail { position: absolute; top: 100%; left: var(--tail); width: 14px; height: 14px; margin: -9px 0 0 -7px; border-radius: 3px; background: #fff; transform: rotate(45deg); transition: left .3s var(--ease), opacity .16s; }
.lu-fly.land .lu-tail { opacity: 0; }
.lu-card.in { animation: lu-in .42s var(--ease) both; }
.lu-card img { flex: none; width: 34px; height: 34px; border-radius: 50%; object-fit: cover; object-position: top center; background: var(--ink-3); }
.lu-card b { font-weight: 800; margin-inline-end: 5px; }
.lu-card .lu-ap { display: block; margin-top: 1px; color: var(--tq-300); font-size: .8rem; font-weight: 800; }
@keyframes lu-in { from { opacity: 0; transform: translateY(12px); } }
.lineup { position: relative; margin-inline: calc(clamp(28px, 4vw, 56px) * -1); margin-bottom: calc(clamp(28px, 4vw, 56px) * -1 - 14px); display: flex; justify-content: center; align-items: flex-end; }
.lu { position: relative; flex: 1 1 19%; min-width: 0; display: flex; flex-direction: column; align-items: center; transition: transform .38s var(--ease); }
.lu:nth-child(3) { flex-basis: 24%; z-index: 2; }
.lu:nth-child(2), .lu:nth-child(4) { z-index: 1; }
.lu:nth-child(2) { transition-delay: .05s; } .lu:nth-child(3) { transition-delay: .1s; } .lu:nth-child(4) { transition-delay: .15s; } .lu:nth-child(5) { transition-delay: .2s; }
.lu img { display: block; width: 112%; max-width: none; margin-inline: -6%; height: auto; transform-origin: 50% 100%; transition: transform .38s var(--ease), filter .38s; }
.lu.talk img { transform: translateY(-7px) scale(1.035); }
.lineup.speaking .lu:not(.talk):not(.off) img { filter: brightness(.82) saturate(.88); }
.lu.off { transform: translateY(16px); }
.lu.off img { filter: grayscale(1) brightness(.68); }
.lu-c { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 5px; color: #fff; font-size: .92rem; font-weight: 800; line-height: 1; }
.lu .sw { background: var(--off-dark); }
.lu .sw[aria-checked="true"] { background: var(--side-acc); }
.lu .sw[aria-checked="true"]::after { background: var(--side-knob); }
@media (prefers-reduced-motion: reduce) { .lg-btn.idle .lg-knob, .lu-card.in { animation: none; } }
.login-form { background: var(--bg); display: grid; place-items: center; padding: clamp(24px, 4vw, 56px); }
.login-form .inner { width: min(420px, 100%); display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.field label, .flabel { font-weight: 800; font-size: .93rem; display: flex; justify-content: space-between; align-items: baseline; }
.inwrap { position: relative; }
.inwrap svg.i { position: absolute; inset-inline-start: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.field input, .field textarea { width: 100%; min-height: 46px; padding: 10px 16px; border: 0; border-radius: 20px; background: var(--tint); transition: background .15s, box-shadow .15s; }
.inwrap input { padding-inline-start: 40px; }
.inwrap input.ltr { padding-right: 40px; padding-left: 14px; }
.field input:focus, .field textarea:focus { outline: 0; background: #fff; box-shadow: var(--ring); }
input.ltr { direction: ltr; text-align: right; }
.or { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: .84rem; }
.fine { color: var(--muted); font-size: .84rem; text-align: center; }

/* חיבור */
.stage { position: relative; display: grid; grid-template-columns: 1fr minmax(90px, 1.3fr) 1fr; align-items: center; gap: 8px; padding: 26px clamp(16px, 4vw, 48px) 20px; background: var(--tq-50); border-radius: var(--r-lg) var(--r-lg) 0 0; }
.stage.ok { background: var(--brand-soft); }
.node { display: grid; justify-items: center; gap: 5px; text-align: center; min-width: 0; }
.node-ic { --ic2: #fff; width: 68px; height: 68px; border-radius: var(--r-lg); background: #fff; box-shadow: var(--sh-up); display: grid; place-items: center; }
.node-ic svg.i, .node-ic svg.fi-i { width: 34px; height: 34px; color: var(--tq); }
.node-ic .mark { display: block; width: 42px; height: auto; color: var(--fg); }
.node b { font-weight: 800; }
.node small { color: var(--muted); font-size: .82rem; }
.wire { position: relative; height: 4px; border-radius: 4px; margin-top: -40px; background-image: repeating-linear-gradient(90deg, var(--brand) 0 8px, transparent 8px 16px); background-size: 16px 4px; animation: flow .7s linear infinite; }
@keyframes flow { to { background-position: -16px 0; } }
.stage.ok .wire { background: var(--tq); animation: none; }
.wire .chk { position: absolute; top: 50%; left: 50%; translate: -50% -50%; width: 30px; height: 30px; border-radius: 50%; background: var(--tq); color: var(--ink); display: grid; place-items: center; box-shadow: 0 0 0 4px var(--brand-soft); animation: pop .35s var(--ease) both; }
.wire .chk svg.i { width: 16px; height: 16px; }
@keyframes pop { from { opacity: 0; scale: .6; } to { opacity: 1; scale: 1; } }
.waitline { display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 800; padding: 12px 20px; flex-wrap: wrap; }
.conn { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(290px, 1fr); gap: 20px; align-items: start; }
.steps { display: grid; padding: 6px 20px 8px; }
.step { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; padding: 15px 0; }
.step:not(:last-child)::before { content: ""; position: absolute; inset-inline-start: 16px; top: 52px; bottom: -12px; width: 2px; background: var(--border); }
.step .n { width: 34px; height: 34px; border-radius: 50%; background: var(--grad); color: var(--on-brand); display: grid; place-items: center; font-family: var(--num); font-weight: 800; font-size: .9rem; position: relative; }
.step h3 { font-size: 1.02rem; font-weight: 800; line-height: 1.35; margin-top: 4px; }
.step p { color: var(--muted); font-size: .92rem; }
.step .body { display: grid; gap: 9px; min-width: 0; }
.cmd { display: flex; align-items: center; gap: 8px; justify-content: space-between; background: var(--brand-soft); border-radius: var(--r); padding: 8px; }
.cmd .code { font-size: 1.06rem; font-weight: 800; padding-inline: 10px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: .86rem; align-items: center; }
.meta .tm { display: inline-flex; align-items: center; gap: 5px; }
.meta svg.i { width: 15px; height: 15px; }
.chatmock { background: var(--ink); color: var(--tint); border-radius: var(--r); padding: 12px 14px; font-size: .9rem; display: grid; gap: 6px; }
.chatmock .q { direction: ltr; text-align: right; font-family: var(--mono); font-size: .84rem; color: var(--brand); }
.flowh { display: flex; align-items: center; gap: 9px; font-weight: 800; }
.flowh .fi { --ic2: var(--brand-soft); width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-soft); color: var(--tq); }
.flowh .fi svg.i, .flowh .fi svg.fi-i { width: 22px; height: 22px; }
.flow { display: grid; gap: 7px; padding: 10px 0 0; font-size: .92rem; }
.flow li { display: flex; gap: 8px; }
.flow svg.i { width: 15px; height: 15px; margin-top: 4px; color: var(--muted); }
.flowbox + .flowbox { margin-top: 24px; }
.okfaces { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px 22px; padding: 18px 20px 6px; }
.okfaces div { display: grid; justify-items: center; gap: 5px; animation: pop .4s var(--ease) both; font-weight: 800; }
.okfaces .face { width: 72px; height: 72px; }
.okfaces small { color: var(--muted); font-weight: 400; font-size: .8rem; }
.okcta { display: flex; justify-content: center; padding: 14px 20px 22px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0 28px; }
.kv > * { padding: 9px 0; }
.kv dt { color: var(--muted); }
.kv dd { font-weight: 800; }
.confirm { background: var(--bg); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; }
.confirm .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* כרטיס עובד */
.wh { position: relative; overflow: hidden; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 22px; padding: 22px 24px 0; background: var(--tq-50); }
.wh::before { content: ""; position: absolute; width: 230px; height: 230px; border-radius: 50%; inset-inline-start: -30px; top: 6px; background: var(--tq-100); }
.wh .port { position: relative; width: 148px; height: 148px; display: block; object-fit: contain; object-position: bottom; flex: none; }
.wh.isoff .port { filter: grayscale(1); opacity: .7; }
.wh .txt { position: relative; flex: 1 1 280px; min-width: 0; padding-bottom: 20px; align-self: center; }
.wh h1 { font-size: 2rem; }
.wh .tt { font-weight: 800; font-size: 1.04rem; }
.wh .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.swbox { position: relative; display: flex; align-items: center; gap: 12px; background: #fff; border-radius: var(--r); box-shadow: var(--sh); padding: 10px 14px; margin-bottom: 20px; align-self: center; }
.swbox b { display: block; line-height: 1.2; font-weight: 800; }
.swbox small { color: var(--muted); font-size: .8rem; }
.ladder { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 18px 12px 8px; }
.rung { position: relative; display: grid; justify-items: center; align-content: start; text-align: center; gap: 4px; padding: 0 10px 8px; border-radius: 12px; }
.rung::before { content: ""; position: absolute; top: 17px; inset-inline-start: 50%; width: 100%; height: 3px; background: var(--border); }
.rung:last-child::before { display: none; }
.rung.past::before { background: var(--brand); }
.rung .n { position: relative; width: 36px; height: 36px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; font-family: var(--num); font-weight: 800; color: var(--muted); transition: background .15s, transform .15s; }
.rung.past .n { background: var(--brand-soft); color: var(--brand-deep); }
.rung[aria-pressed="true"] .n { background: var(--tq); color: var(--ink); box-shadow: 0 0 0 5px rgba(31, 176, 204, .25); }
.rung:hover .n { transform: scale(1.08); }
.rung[aria-disabled="true"] { cursor: help; }
.rung[aria-disabled="true"]:hover .n { transform: none; }
.rung b { font-weight: 800; margin-top: 6px; line-height: 1.25; }
.rung small { color: var(--muted); font-size: .84rem; line-height: 1.35; max-width: 24ch; }
.wgrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.hbbig { font-size: 1.3rem; font-weight: 800; line-height: 1.2; }
.hbbig.bad { color: var(--red); }
.chart { display: block; width: 100%; height: auto; margin-top: 10px; }
.chartf { display: flex; justify-content: space-between; color: var(--muted); font-size: .78rem; margin-top: 2px; }
.tl { position: relative; display: grid; gap: 14px; padding: 16px 20px; }
.tl::before { content: ""; position: absolute; inset-inline-start: 24px; top: 24px; bottom: 28px; width: 2px; background: var(--border); }
.tl li { position: relative; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; }
.tl .d { width: 10px; height: 10px; border-radius: 50%; background: var(--tq); box-shadow: 0 0 0 3px #fff; position: relative; top: 1px; }
.tl .d.stop { background: var(--or-600); }
.tl .d.ask { background: var(--ink); }
.tl time { color: var(--muted); font-size: .82rem; white-space: nowrap; }
.mstats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mstat { background: var(--bg); border-radius: var(--r); padding: 12px 16px; }
.mstat b { display: block; font-family: var(--num); font-size: 1.45rem; font-weight: 800; line-height: 1.1; }
.mstat small { color: var(--muted); font-size: .82rem; }

/* תור האישורים */
.inbox { display: grid; grid-template-columns: 340px minmax(0, 1fr); overflow: hidden; }
.ilist { background: #fff; min-width: 0; padding-bottom: 8px; }
.iitem { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 11px; padding: 13px 14px; margin: 0 8px 4px; width: calc(100% - 16px); border-radius: var(--r); transition: background .15s; }
.iitem:hover { background: var(--hover); }
.iitem[aria-current="true"] { background: var(--brand-soft); }
.iitem b { display: block; font-weight: 800; line-height: 1.3; }
.iitem small { display: block; color: var(--muted); font-size: .82rem; margin-top: 2px; }
.iitem .pill { margin-top: 6px; }
.idone { padding: 12px 16px 14px; }
.idone h3 { font-size: .8rem; font-weight: 800; color: var(--muted); margin-bottom: 6px; }
.idone li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; font-size: .88rem; }
.idetail { padding: 22px clamp(16px, 2.4vw, 30px) 24px; display: grid; gap: 16px; align-content: start; background: var(--hover); min-width: 0; }
.dhead { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.dhead h2 { font-size: 1.22rem; font-weight: 800; line-height: 1.25; }
.dhead small { color: var(--muted); font-size: .86rem; }
.preview { background: #fff; border-radius: var(--r-lg); box-shadow: var(--sh); max-width: 600px; overflow: hidden; }
.pv-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 8px; }
.pv-h .pva { width: 34px; height: 34px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; font-weight: 800; flex: none; }
.pv-h b { display: block; line-height: 1.2; font-weight: 800; }
.pv-h small { color: var(--muted); font-size: .8rem; }
.pv-b { padding: 13px 16px 15px; }
.mailh { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; padding: 12px 16px; background: var(--hover); font-size: .9rem; }
.mailh dt { color: var(--muted); }
.mailh dd { font-weight: 400; }
.filel li { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
.filel li:nth-child(even) { background: var(--hover); }
.filel svg.i { color: var(--muted); }
.will { display: flex; gap: 10px; align-items: flex-start; font-weight: 800; max-width: 600px; }
.will svg.i { color: var(--brand-deep); margin-top: 3px; }
.apact { display: flex; flex-wrap: wrap; gap: 8px; }
.apact .btn.pri { min-width: 120px; }

/* שיחות */
main.fill { padding: 0; }
.ig-h { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 12px 16px 6px; background: #fff; }
.ig-h b { display: block; font-weight: 800; line-height: 1.2; }
.ig-h small { display: block; color: var(--muted); font-size: .8rem; }
.ig-n { margin-inline-start: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--grad); color: var(--on-brand); font-family: var(--num); font-size: .72rem; font-weight: 800; display: grid; place-items: center; }
.iitem.nf { grid-template-columns: minmax(0, 1fr); }
.m-queue { align-self: flex-end; width: min(520px, 100%); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: #fff; border-radius: var(--r); box-shadow: var(--sh); font-weight: 800; }
.cs { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: calc(100vh - var(--bar) - var(--top)); height: calc(100dvh - var(--bar) - var(--top)); background: #fff; }
.cs-list { overflow-y: auto; min-height: 0; padding-bottom: 12px; }
.cs-lh { padding: 18px 18px 8px; }
.cs-lh h1 { font-size: 1.35rem; font-weight: 800; line-height: 1.2; }
.cs-lh p { color: var(--muted); font-size: .88rem; margin-top: 2px; }
.cs-sec { padding: 14px 18px 4px; font-size: .74rem; font-weight: 800; color: var(--muted); }
.cs-item { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 11px; align-items: center; width: calc(100% - 16px); margin-inline: 8px; padding: 10px 12px; border-radius: var(--r); text-align: start; transition: background .15s; }
.cs-item:hover { background: var(--hover); }
.cs-item[aria-current="true"] { background: var(--brand-soft); }
.cs-item b { display: block; font-weight: 800; line-height: 1.25; }
.cs-item small { display: block; color: var(--muted); font-size: .84rem; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cs-item.un small { color: var(--fg); font-weight: 800; }
.cs-meta { display: grid; justify-items: end; gap: 4px; font-size: .74rem; color: var(--muted); }
.cs-un { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--grad); color: var(--on-brand); font-family: var(--num); font-size: .7rem; font-weight: 800; display: grid; place-items: center; }
.cs-av { position: relative; display: inline-flex; flex: none; }
.cs-av > .dot { position: absolute; bottom: 0; inset-inline-end: 0; outline: 2px solid #fff; }
.cs-cl { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--fg); color: #fff; display: grid; place-items: center; }
.cs-cl.s { width: 30px; height: 30px; }
.cs-cl svg.i { width: 19px; height: 19px; }
.cs-cl.s svg.i { width: 15px; height: 15px; }
.cs-th { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.cs-h { display: flex; align-items: center; gap: 11px; padding: 10px clamp(12px, 2vw, 22px); background: #fff; }
.cs-h > div { min-width: 0; flex: 1; }
.cs-h b { display: block; font-weight: 800; font-size: 1.05rem; line-height: 1.25; }
.cs-h small { display: block; color: var(--muted); font-size: .84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cs-back { display: none; }
.cs-bn { padding: 12px clamp(12px, 3vw, 34px) 0; }
.cs-msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 18px clamp(12px, 3vw, 34px); display: flex; flex-direction: column; gap: 10px; }
.cs-empty { margin: auto; text-align: center; color: var(--muted); max-width: 34ch; }
.m-row { display: flex; gap: 8px; align-items: flex-end; max-width: min(640px, 92%); }
.m-row.me { align-self: flex-start; }
.m-row.w { align-self: flex-end; }
.m { padding: 10px 16px; border-radius: 20px; line-height: 1.5; box-shadow: var(--sh); overflow-wrap: anywhere; white-space: pre-wrap; }
.m p + p { margin-top: 8px; }
.m.me { background: var(--brand-soft); border-start-start-radius: 6px; box-shadow: none; }
.m.w { background: #fff; border-start-end-radius: 6px; }
.m-t { display: flex; align-items: center; gap: 4px; font-size: .72rem; color: var(--muted); margin-top: 3px; padding-inline: 4px; }
.m-t svg.i { width: 13px; height: 13px; }
.m-t.ok svg.i { color: var(--green); }
.m-note, .m-day { align-self: center; text-align: center; font-size: .8rem; border-radius: 999px; padding: 3px 12px; }
.m-note { color: var(--muted); background: #fff; }
.m-day { color: var(--muted); font-weight: 800; background: var(--tint); }
.m-ap { width: min(520px, 100%); align-self: flex-end; background: #fff; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh); flex: none; }
.m-ap-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 14px; background: var(--brand-soft); font-weight: 800; font-size: .92rem; }
.m-ap.done { box-shadow: none; }
.m-ap.done .m-ap-h { background: #fff; font-weight: 400; }
.m-ap-b { padding: 12px 14px; display: grid; gap: 10px; }
.m-ap-b > b { font-weight: 800; }
.td { display: inline-flex; gap: 4px; align-items: center; height: 18px; }
.td i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: tdot 1s infinite; }
.td i:nth-child(2) { animation-delay: .15s; }
.td i:nth-child(3) { animation-delay: .3s; }
@keyframes tdot { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
.cs-foot { background: #fff; padding: 10px clamp(12px, 3vw, 34px) 12px; display: grid; gap: 8px; }
.cs-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.cs-chips::-webkit-scrollbar { display: none; }
.cs-chip { flex: none; min-height: 36px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 999px; background: var(--bg); font-size: .88rem; font-weight: 800; white-space: nowrap; transition: background .15s, color .15s; }
.cs-chip:hover { background: var(--brand-soft); color: var(--brand-deep); }
.cs-form { display: flex; align-items: flex-end; gap: 8px; }
.cs-form textarea { flex: 1; min-width: 0; resize: none; min-height: 44px; padding: 11px 16px; border: 0; border-radius: 22px; max-height: 140px; font: inherit; background: var(--tint); color: inherit; }
.cs-form textarea:focus { outline: 0; background: #fff; box-shadow: var(--ring); }
.cs-form .btn { height: 44px; }
.cs-fix { display: flex; align-items: center; gap: 8px; justify-content: space-between; font-size: .86rem; font-weight: 800; background: var(--brand-soft); border-radius: var(--r); padding: 6px 12px; }
.cs-block { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-weight: 800; padding-block: 4px; }
.chatb svg.i { width: 17px; height: 17px; }
.quick { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; background: #fff; border-radius: 999px; box-shadow: var(--sh); transition: box-shadow .15s; }
.quick:focus-within { box-shadow: var(--sh), var(--ring); }
.quick input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 1rem; padding: 6px 2px; color: inherit; }
.fs-i { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 11px 16px; margin: 0 10px 6px; border-radius: var(--r); background: var(--row); }
.fs-i:last-child { margin-bottom: 10px; }
.fs-i > b { flex: 1 1 200px; font-weight: 800; }
.fs-c { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--tint); color: var(--muted); font-family: var(--num); font-weight: 800; font-size: .78rem; }
.fs-c svg.i { width: 15px; height: 15px; }
.fs-i.done .fs-c { background: var(--brand-soft); color: var(--brand-deep); }
.fs-i.done > b { color: var(--muted); font-weight: 400; }
.fs-i.next { background: var(--brand-soft); }
.fs-i.next .fs-c { background: var(--tq); color: var(--ink); }
.modal.welcome { width: min(500px, 100%); padding: 0; gap: 0; overflow: hidden; }
.welcome-top { background: var(--panel); color: #fff; padding: 18px 22px; }
.says { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; padding: 18px 22px 4px; align-items: start; }
.says img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; object-position: top center; background: var(--brand-soft); }
.says .bub { position: relative; background: var(--brand-soft); border-radius: 16px; border-start-end-radius: 4px; padding: 12px 14px; line-height: 1.5; }
.says .bub p + p { margin-top: 8px; }
.says .tx { opacity: 0; animation: saysin .25s .9s forwards; }
.says .td { position: absolute; inset-inline-start: 14px; top: 14px; animation: saysout 0s .9s forwards; }
@keyframes saysin { to { opacity: 1; } }
@keyframes saysout { to { visibility: hidden; } }

/* חלון וטוסט */
.scrim { position: fixed; inset: 0; background: rgba(13, 17, 23, .5); display: grid; place-items: center; padding: 16px; z-index: 80; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: #fff; border-radius: var(--r-lg); width: min(440px, 100%); padding: 22px; display: grid; gap: 14px; box-shadow: var(--sh-up); }
.modal h2 { font-size: 1.25rem; font-weight: 800; }
.modal .row { display: flex; gap: 8px; }
.toast { position: fixed; left: 50%; translate: -50% 0; bottom: 22px; background: var(--fg); color: #fff; border-radius: 999px; padding: 10px 20px; font-weight: 800; font-size: .9rem; z-index: 90; max-width: calc(100% - 32px); text-align: center; box-shadow: var(--sh-up); }

/* נייד */
/* דשבורד חי: אותה שורת דמויות כמו בכניסה, ולכל עובד בועה עם מה שהוא עושה עכשיו */
.dhero { position: relative; overflow: hidden; border-radius: var(--r-lg); background: var(--panel); color: #fff; padding: clamp(18px, 2.2vw, 28px) clamp(18px, 2.6vw, 34px) 0; box-shadow: var(--sh-up); }
.dhero::before { content: ""; position: absolute; width: 520px; height: 520px; border-radius: 50%; top: -250px; inset-inline-end: -150px; background: var(--ink-2); pointer-events: none; }
.dhero :focus-visible { outline-color: #fff; }
.dhero.flat { padding-bottom: clamp(18px, 2.2vw, 28px); }
.dh-top { position: relative; display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: flex-start; justify-content: space-between; }
.dh-top > div:first-child { flex: 1 1 340px; min-width: 0; }
.dh-date { display: block; color: var(--ink-mut); font-size: .88rem; font-weight: 400; margin-bottom: 3px; }
.dh-top h1 { font-size: clamp(1.7rem, 2.8vw, 2.5rem); color: #fff; }
.dh-sum { margin-top: 8px; font-size: clamp(1.02rem, 1.25vw, 1.16rem); line-height: 1.4; max-width: 60ch; color: var(--tint); min-height: 2.8em; }
.dh-side { display: grid; gap: 8px; justify-items: end; }
.dlive { display: inline-flex; align-items: center; gap: 7px; font-size: .84rem; font-weight: 800; padding: 3px 11px 3px 12px; border-radius: 999px; background: var(--ink-3); color: #fff; white-space: nowrap; }
.dlive .dot { background: var(--side-acc); }
.dlive.bad { background: var(--or-soft); color: var(--or-ink); }
.dlive.bad .dot { background: var(--ink); }
.dstats { display: flex; gap: 8px; }
.dstat { min-width: 98px; padding: 9px 14px; border-radius: var(--r); background: var(--ink-2); color: #fff; transition: background .15s; }
button.dstat:hover { background: var(--ink-3); }
.dstat b { display: block; font-family: var(--num); font-size: 1.4rem; font-weight: 800; line-height: 1.15; }
.dstat small { display: block; font-size: .78rem; color: var(--ink-mut); white-space: nowrap; }
.bump { display: inline-block; animation: d-bump .5s var(--ease); }
@keyframes d-bump { 40% { transform: scale(1.24); } }

.dline { position: relative; display: flex; align-items: flex-end; justify-content: center; margin-top: -14px; }
.dw { position: relative; flex: 1 1 0; min-width: 0; max-width: 232px; display: flex; flex-direction: column; align-items: center; transition: transform .38s var(--ease); }
.dw-bub { width: 100%; min-height: 104px; display: flex; align-items: flex-end; justify-content: center; padding: 0 5px 11px; }
.dbub { position: relative; width: 100%; max-width: 206px; padding: 8px 11px 9px; border-radius: 14px; background: #fff; color: var(--fg); box-shadow: 0 10px 26px rgba(0, 0, 0, .45); font-size: .9rem; font-weight: 800; line-height: 1.25; text-align: center; transform-origin: 50% 100%; }
.dbub::after { content: ""; position: absolute; top: 100%; left: 50%; width: 13px; height: 13px; margin: -8px 0 0 -6.5px; border-radius: 3px; background: inherit; transform: rotate(45deg); }
.dbub .dt { display: block; margin-top: 2px; font-size: .78rem; font-weight: 400; color: var(--muted); }
.dbub.late { background: var(--or-soft); color: var(--or-ink); }
.dbub .lu-dots { opacity: 0; }
.dbub.pop { animation: dbub-in .5s cubic-bezier(.3, 1.28, .6, 1) both; }
.dbub.pop .lu-dots { animation: d-dots .72s both; }
.dbub.pop .dbub-tx { animation: d-tx .28s .68s both; }
@keyframes dbub-in { from { opacity: 0; transform: translateY(46px) scale(.22); } to { opacity: 1; transform: none; } }
@keyframes d-dots { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
@keyframes d-tx { from { opacity: 0; } to { opacity: 1; } }
.d-fly { position: fixed; top: 0; left: 0; z-index: 80; margin: 0; max-width: none; overflow: hidden; pointer-events: none; }
.d-fly.land { transition: transform .62s cubic-bezier(.45, .05, .2, 1), width .62s cubic-bezier(.45, .05, .2, 1), height .62s cubic-bezier(.45, .05, .2, 1), border-radius .62s, box-shadow .62s; border-radius: var(--r); box-shadow: none; }
.d-fly::after { display: none; }

.dw-who { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; color: #fff; text-align: center; }
.dw-name { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 1.05rem; line-height: 1.15; }
.dw-name .dot { display: none; background: var(--side-acc); }
.dw.is-work .dw-name .dot { display: inline-block; }
.dw-who:hover .dw-name { text-decoration: underline; text-underline-offset: 3px; }
.dw-sub { display: block; min-height: 1.3em; font-size: .8rem; color: var(--ink-mut); line-height: 1.3; white-space: nowrap; }
.dw.is-late .dw-sub { color: var(--or-300); font-weight: 800; }
.dw-pic { display: block; width: 100%; line-height: 0; }
.dw-pic img { display: block; width: min(100%, 172px); height: auto; margin: 11px auto -14px; transform-origin: 50% 100%; transition: transform .38s var(--ease), filter .38s; }
.dw.is-work .dw-pic img { transform: translateY(-4px) scale(1.03); }
.dw.is-idle .dw-pic img { filter: brightness(.84) saturate(.9); }
.dw.is-late .dw-pic img { filter: brightness(.74) saturate(.8); }
.dw.is-off .dw-pic img, .dw.is-halt .dw-pic img, .dw.is-quiet .dw-pic img { filter: grayscale(1) brightness(.68); }
.dw.is-off, .dw.is-halt { transform: translateY(12px); }
.dw-ap { position: absolute; z-index: 3; bottom: 34px; inset-inline-start: calc(50% + 34px); min-width: 26px; height: 26px; padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--tq); color: var(--ink); font-family: var(--num); font-size: .78rem; font-weight: 800; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); }
.dw-ap:hover { filter: brightness(1.08); }

.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.dseg { display: inline-flex; background: var(--tint); border-radius: 999px; padding: 4px; gap: 2px; flex: none; }
.dseg button { min-height: 32px; padding: 0 16px; border-radius: 999px; font-size: .88rem; font-weight: 800; color: var(--muted); transition: background .15s, color .15s; }
.dseg button:hover { color: var(--fg); }
.dseg button[aria-pressed="true"] { background: #fff; color: var(--fg); box-shadow: var(--sh); }

/* רצועת היום: כל פס הוא עבודה, הזמן זורם מימין לשמאל, והקו הוא עכשיו */
.tlx { --who: 92px; --sum: 158px; padding: 10px 20px 12px; }
.tl-row { display: grid; grid-template-columns: var(--who) minmax(0, 1fr) var(--sum); gap: 12px; align-items: center; padding-block: 5px; }
.tl-who { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 800; }
.tl-who:hover b { color: var(--brand-deep); }
.tl-who b { font-weight: 800; }
.tl-lane { position: relative; height: 32px; border-radius: var(--r-s); background: var(--bg); }
.tl-lane.off { background: repeating-linear-gradient(135deg, var(--bg) 0 6px, var(--tint) 6px 8px); }
.tlx:not(.noline) .tl-lane::after { content: ""; position: absolute; top: -5px; bottom: -5px; inset-inline-start: var(--now); width: 2px; margin-inline-start: -1px; background: var(--fg); opacity: .5; pointer-events: none; }
.tl-b { position: absolute; top: 4px; bottom: 4px; min-width: 5px; border-radius: 6px; background: var(--brand); box-shadow: 0 0 0 1px var(--card); }
.tl-b:hover { filter: brightness(.86); }
.tl-b.run { min-width: 8px; background-color: var(--brand-deep); background-image: repeating-linear-gradient(135deg, hsl(0 0% 100% / .38) 0 5px, transparent 5px 10px); background-size: 200% 100%; animation: tl-run 1.4s linear infinite; }
@keyframes tl-run { to { background-position: -40px 0; } }
.tl-miss { position: absolute; top: 50%; width: 16px; height: 16px; margin-top: -8px; transform: translateX(50%); border-radius: 50%; background: var(--or-600); box-shadow: 0 0 0 2px var(--card); }
.tl-note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 400; color: var(--muted); pointer-events: none; }
.tl-lane.off .tl-note { color: var(--muted); }
.tl-hours { position: relative; height: 22px; font-size: .76rem; color: var(--muted); }
.tl-hours span { position: absolute; top: 2px; transform: translateX(50%); }
.tl-hours span.first { transform: none; }
.tl-hours span.last { transform: translateX(100%); }
.tl-now { position: absolute; top: 0; z-index: 2; inset-inline-start: var(--now); transform: translateX(50%); padding: 0 8px; border-radius: 999px; background: var(--fg); color: #fff; font-family: var(--num); font-weight: 800; line-height: 1.5; }
.tlx.noline .tl-now { display: none; }
.tl-sum { min-width: 0; line-height: 1.25; }
.tl-sum b { display: block; font-weight: 800; font-size: .92rem; }
.tl-sum small { display: block; color: var(--muted); font-size: .78rem; }
.d-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 10px 20px 14px; font-size: .8rem; color: var(--muted); }
.d-foot > span { display: inline-flex; align-items: center; gap: 6px; }
.d-foot i { flex: none; display: inline-block; }
.lg-work { width: 18px; height: 10px; border-radius: 3px; background: var(--brand); }
.lg-miss { width: 10px; height: 10px; border-radius: 50%; background: var(--or-600); }
.lg-off { width: 18px; height: 10px; border-radius: 3px; background: repeating-linear-gradient(135deg, var(--bg) 0 3px, var(--off) 3px 5px); }
.d-foot .sp { margin-inline-start: auto; }

/* השבוע: גוון אחד, כהה יותר כשנעשה יותר, והמספר כתוב בתוך הריבוע */
.wk { --who: 92px; --sum: 158px; padding: 10px 20px 12px; display: grid; gap: 5px; }
.wk-row { display: grid; grid-template-columns: var(--who) repeat(7, minmax(0, 1fr)) var(--sum); gap: 5px; align-items: center; }
.wk-d { text-align: center; font-size: .78rem; font-weight: 400; color: var(--muted); }
.wk-d.today { color: var(--fg); font-weight: 800; }
.wk-c { height: 36px; border-radius: var(--r-s); display: grid; place-items: center; font-family: var(--num); font-weight: 800; font-size: .88rem; color: var(--fg); background: var(--bg); font-variant-numeric: tabular-nums; }
.wk-c.l1 { background: var(--tq-100); }
.wk-c.l2 { background: var(--tq-200); }
.wk-c.l3 { background: var(--tq-300); }
.wk-c.l4 { background: var(--tq-700); color: #fff; }
.wk-c.today { box-shadow: 0 6px 14px rgba(13, 17, 23, .18); transform: translateY(-2px); }
.wk-sum { margin-inline-start: 7px; min-width: 0; line-height: 1.25; }
.wk-sum b { display: block; font-weight: 800; font-size: .92rem; }
.wk-sum small { display: block; color: var(--muted); font-size: .78rem; }

/* מה קרה לאחרונה */
.frow { display: flex; align-items: center; gap: 10px; padding: 9px 14px; margin: 0 10px 6px; border-radius: var(--r); background: var(--row); transition: transform .42s var(--ease); }
.frow:last-child { margin-bottom: 10px; }
.frow-none { padding: 18px; color: var(--muted); font-size: .9rem; }
.frow .tx { flex: 1; min-width: 0; font-size: .9rem; line-height: 1.3; }
.frow .tx b { font-weight: 800; }
.frow .tx small { display: block; color: var(--muted); font-size: .78rem; }
.frow time { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.frow.fresh { animation: frow-in 1.1s var(--ease); }
@keyframes frow-in { from { background: var(--brand-soft); } to { background: var(--row); } }
.d-tip { position: fixed; z-index: 90; max-width: 260px; padding: 5px 10px; border-radius: 8px; background: var(--fg); color: #fff; font-size: .8rem; font-weight: 800; line-height: 1.3; pointer-events: none; transform: translate(-50%, calc(-100% - 8px)); box-shadow: var(--sh-up); }

/* תצוגת מנהל: שורה לכל אדם */

@media (max-width: 1180px) { .dgrid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 1100px) {
}
@media (max-width: 1040px) {
  .dline { display: grid; gap: 0; margin-top: 12px; padding-bottom: 6px; }
  .dw { max-width: none; display: grid; grid-template-columns: 62px minmax(0, 1fr); column-gap: 12px; grid-template-areas: "pic who" "pic bub"; align-items: center; padding: 10px 12px; margin-bottom: 8px; border-radius: var(--r); background: var(--ink-2); transform: none !important; }
  .dw-pic { grid-area: pic; width: 62px; align-self: start; }
  .dw-pic img { width: 62px; height: 62px; margin: 0; border-radius: 50%; object-fit: cover; object-position: top center; background: var(--ink-3); transform: none !important; }
  .dw-who { grid-area: who; flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; text-align: start; }
  .dw-bub { grid-area: bub; min-height: 0; padding: 0; justify-content: flex-start; }
  .dbub { max-width: none; margin-top: 7px; text-align: start; }
  .dbub:empty { display: none; }
  .dbub::after { top: 12px; left: auto; inset-inline-start: 0; margin: 0 -6px 0 0; }
  .dw-ap { bottom: auto; top: 8px; inset-inline-start: auto; inset-inline-end: 0; }
}
@media (max-width: 720px) {
  .dh-side { justify-items: stretch; width: 100%; }
  .dlive { justify-self: start; }
  .dstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dstat { min-width: 0; padding: 7px 10px; }
  .dstat small { white-space: normal; line-height: 1.15; }
  .tl-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "who sum" "lane lane"; gap: 4px 12px; padding-block: 7px; }
  .tl-row .tl-who { grid-area: who; } .tl-row .tl-sum { grid-area: sum; text-align: end; } .tl-row .tl-lane, .tl-row .tl-hours { grid-area: lane; }
  .tl-row.ax { grid-template-areas: "lane lane"; }
  .tl-row.ax > span:not(.tl-hours) { display: none; }
  .tl-hours .opt { display: none; }
  .tl-sum small { max-width: 200px; }
  .wk-row { grid-template-columns: 34px repeat(7, minmax(0, 1fr)); gap: 4px; }
  .wk-who b, .wk-row.hd .wk-sum { display: none; }
  .wk-sum { grid-column: 2 / -1; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
  .wk-c { height: 32px; font-size: .84rem; }
  .d-foot .sp { margin-inline-start: 0; }
}
@media (max-width: 1100px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .board-th { display: none; }
  .hb-lab { display: inline; }
  .bw { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "w c s" "h h h" "l l l"; gap: 8px 12px; }
  .bw > .chatb { grid-area: c; }
  .bw-who { grid-area: w; }
  .bw > .sw { grid-area: s; }
  .hb { grid-area: h; }
  .lvcell { grid-area: l; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidenav { position: fixed; bottom: 0; top: auto; inset-inline: 0; height: auto; z-index: 50; flex-direction: row; padding: 5px 6px calc(5px + env(safe-area-inset-bottom)); }
  .brand, .nav-foot, .navs small { display: none; }
  .navs { padding: 0; display: block; overflow: visible; width: 100%; }
  .navs section { display: contents; }
  .navs .all { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; }
  .navs ul { display: contents; }
  .nv { flex-direction: column; gap: 1px; font-size: .72rem; padding: 5px 2px; text-align: center; }
  .nv[aria-current="page"]::after { display: none; }
  .nv-count { position: absolute; top: 0; inset-inline-end: calc(50% - 24px); min-width: 17px; height: 17px; font-size: .66rem; padding: 0 4px; }
  .top-logo { display: inline-flex; }
  .acct-name { display: none; }
  .pcchip { border: 0; padding: 0; }
  main { padding-bottom: 96px; }
  .two, .conn, .wgrid { grid-template-columns: minmax(0, 1fr); }
  .login { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .login-form { order: -1; }
  .login-side { min-height: 0; }
  .login-side h2 { font-size: clamp(1.6rem, 7.3vw, 3.4rem); }
  .login-side p { font-size: clamp(1.1rem, 4.6vw, 1.6rem); }
  .lu-card { font-size: .9rem; }
  .lu-c { font-size: .82rem; }
  .proto-note { display: none; }
  .inbox { grid-template-columns: minmax(0, 1fr); }
  .cs { grid-template-columns: minmax(0, 1fr); height: calc(100vh - var(--bar) - var(--top) - 62px); height: calc(100dvh - var(--bar) - var(--top) - 62px); }
    .cs .cs-th { display: none; }
  .cs.open .cs-th { display: flex; }
  .cs.open .cs-list { display: none; }
  .cs-back { display: grid; }
  main.fill { padding-bottom: 0; }
  .ilist { padding-bottom: 8px; }
  .ladder { grid-template-columns: minmax(0, 1fr); padding: 14px 16px; gap: 2px; }
  .rung { grid-template-columns: 36px minmax(0, 1fr); justify-items: start; text-align: start; column-gap: 12px; padding: 0 0 14px; }
  .rung .n { grid-row: span 2; }
  .rung b { margin-top: 0; }
  .rung small { max-width: none; }
  .rung::before { top: 36px; bottom: 0; inset-inline-start: 17px; width: 3px; height: auto; }
  .wh .port { width: 112px; height: 112px; }
  .swbox { width: 100%; }
  .toast { bottom: 84px; }
}
@media (max-width: 520px) {
  .tiles { gap: 10px; }
  .tile { padding: 14px; }
  .tile .val { font-size: 1.5rem; }
  .step .n { width: 30px; height: 30px; }
  .cmd { flex-wrap: wrap; }
  .cmd .code { font-size: .96rem; flex: 1 1 100%; padding-block: 4px; }
  .cmd .btn { width: 100%; }
  .stage { padding-inline: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .says .tx { opacity: 1; }
  .says .td { display: none; }
}
</style>

<div class="proto" id="proto"></div>
<div id="app"></div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="d-tip" id="d-tip" hidden></div>

  'fix-no': function () { S.fixing = null; render(); },
  'after-connect': function () { if (P().workers.length) S.welcome = true; go('team'); },
  'welcome-yes': function () { S.welcome = false; ACT['chat-open']({ id: 'meni' }); },
  'welcome-no': function () { S.welcome = false; render(); },
  'steps-hide': function () { S.stepsHidden = true; render(); },
  'chat-open': function () {
    if (S.route !== 'chat') go('chat'); else render();
    var i = document.getElementById('chat-in'); if (i && window.innerWidth > 860) i.focus();
  },
  'chat-chip': function (d) { sendChat('meni', d.text); },
  'ap-worker': function (d) { var a = P().approvals.filter(function (x) { return x.w === d.id; })[0]; S.apSel = a ? a.id : null; go('approvals'); },
  'lu-all': function (d, el) { var on = el.getAttribute('aria-pressed') !== 'true'; LU_CAST.forEach(function (k) { LU.off[k] = !on; }); if (on) LU.force = 'meni'; luSync(); luPush(); },
  'lu-sw': function (d) { LU.off[d.id] = !LU.off[d.id]; if (!LU.off[d.id]) { LU.force = d.id; LU.next = 0; } else if (LU.who === d.id) { luStop(); LU.next = Date.now() + 500; } luSync(); if (!LU.off[d.id] || !LU_CAST.some(function (k) { return !LU.off[k]; })) luPush(); },
};
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) { if (S.more && !e.target.closest('.proto-more')) { S.more = false; renderProto(); } return; }
  if (el.classList.contains('scrim') && e.target !== el) return;
  var fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && (S.more || S.welcome)) { S.more = false; S.welcome = false; render(); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chat-in') { e.preventDefault(); e.target.form.requestSubmit(); }
});
document.addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target, kind = f.dataset.form;
  if (kind === 'login') {
    /* הדגמה: הכניסה נפתחת על צוות מלא, כי מי שמקבל קישור לא יכול לחבר מחשב. את מסך החיבור רואים בסרגל למעלה */
    if (P().status !== 'connected') connect('me', !S.zero); go('team');
  } else if (kind === 'fix') {
    var fixText = document.getElementById('fix-in').value.trim(), fixA = P().approvals.filter(function (x) { return x.id === f.dataset.id; })[0];
    if (fixText && P().threads[fixA.w]) P().threads[fixA.w].items.push({ t: 'me', text: fixText, at: 'עכשיו', st: rep() ? 'ok' : 'wait' });
    settle(f.dataset.id, 'הוחזר לתיקון', 'accent', function () { return 'הוחזר לתיקון. הגרסה החדשה תחכה כאן.'; });
  } else if (kind === 'chat') {
    var input = document.getElementById('chat-in'), text = input.value.trim(), tid = 'meni';
    if (!text) return;
    input.value = ''; S.drafts[tid] = '';
    sendChat(tid, text);
  } else if (kind === 'quick') {
    var qt = document.getElementById('quick-in').value.trim();
    if (!qt) return;
    go('chat'); sendChat('meni', qt);
  }
});
if (!LU_STILL) setInterval(function () { if (S.route === 'login' && !document.hidden && !LU.busy && Date.now() >= LU.next) luPush(); }, 200);
/* שעון הקוד רץ רק על הטקסט, בלי לצייר מחדש את המסך */
setInterval(function () {
  Object.keys(S.people).forEach(function (k) { if (S.people[k].secs > 0) S.people[k].secs--; });
  var t = document.getElementById('timer');
  if (t && S.route === 'connect') { var s = P().secs, m = Math.floor(s / 60); s = s % 60; t.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
}, 1000);
setInterval(simTick, 1000);
document.addEventListener('mouseover', dTipFor);
document.addEventListener('click', dTipFor);
window.addEventListener('scroll', function () { var t = document.getElementById('d-tip'); if (t) t.hidden = true; }, true);
/* כתובת עם מסך מסוים פותחת אותו ישר */
(function () {
  var h = (location.hash || '').replace('#', '');
  /* כתובות של מסך האנשים ושל תצוגת המנהל מגרסה 8 נפתחות על הצוות ועל הדשבורד */
  if (h === 'people') h = 'team';
  if (h === 'dash-all') h = 'dash';
  if (h && h !== 'login') { if (h !== 'connect') connect('me', true); S.route = h; }
  render();
})();
</script>
</body>
</html>
